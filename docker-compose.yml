services:
  mysql:
    image: mysql:8.4
    container_name: soga-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-soga_dev_root}
      MYSQL_DATABASE: ${DB_NAME:-soga}
    ports:
      - "3306:3306"
    volumes:
      - soga_mysql_data:/var/lib/mysql
      - ./database/SoGa.sql:/docker-entrypoint-initdb.d/01-soga.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  soga_mysql_data:
